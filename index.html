  // The view password opens the read-only part; the edit password opens the part that also carries the editing details.
  async function decryptWith(password) {
    try { return await open(P.view, password); } catch (e) { return await open(P.edit, password); }
  }

  /* ---------- editing: an in-page stand-in for the hub database, saved to GitHub ---------- */
  function createEditor(v, editPassword) {
    var API = v.api || 'https://api.github.com';
    var repoUrl = API + '/repos/' + v.repo + '/contents/index.html';
    var cols = { webinars: {}, tasks: {}, links: {} };
    var listeners = { webinars: [], tasks: [], links: [] };
    COLS.forEach(function (n) { (v.data[n] || []).forEach(function (d) { var o = Object.assign({}, d), id = o.id; delete o.id; cols[n][id] = o; }); });

    var rev = 0, savedRev = 0, saving = false, timer = null, conflict = false;
    var bar = null, msg = null, actions = null;

    function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
    function setToken(t) { try { if (t) { localStorage.setItem(TOKEN_KEY, t); } else { localStorage.removeItem(TOKEN_KEY); } } catch (e) {} }
    function genId() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function clone(o) { return JSON.parse(JSON.stringify(o)); }
    function snapshot(name) {
      return { docs: Object.keys(cols[name]).map(function (id) { return { id: id, data: function () { return Object.assign({}, cols[name][id]); } }; }) };
    }
    function changed(name) {
      listeners[name].forEach(function (f) { f(snapshot(name)); });
      rev++; schedule();
    }
    function serialize() {
      var out = {};
      COLS.forEach(function (n) { out[n] = Object.keys(cols[n]).map(function (id) { return Object.assign({ id: id }, cols[n][id]); }); });
      out.tasks.sort(function (a, b) { return String(a.webinarId || '').localeCompare(String(b.webinarId || '')) || (a.order || 0) - (b.order || 0); });
      return out;
    }

    var db = { collection: function (name) {
      return {
        doc: function (id) {
          id = id || genId();
          return {
            id: id,
            set: function (body) { cols[name][id] = clone(body); changed(name); return Promise.resolve(); },
            update: function (body) { cols[name][id] = Object.assign({}, cols[name][id], clone(body)); changed(name); return Promise.resolve(); },
            delete: function () { delete cols[name][id]; changed(name); return Promise.resolve(); }
          };
        },
        add: function (body) { var id = genId(); cols[name][id] = clone(body); changed(name); return Promise.resolve({ id: id }); },
        onSnapshot: function (cb) { listeners[name].push(cb); setTimeout(function () { cb(snapshot(name)); }, 0); return function () {}; }
      };
    } };
    var claude = { use: function (n) { return Promise.resolve(n === 'db' ? db : n === 'user' ? { can: function () { return Promise.resolve(true); } } : null); } };

    /* GitHub */
    function headers(token, extra) {
      return Object.assign({ Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, extra || {});
    }
    async function ghGet(token) {
      var r = await fetch(repoUrl + '?ref=main&t=' + Date.now(), { headers: headers(token), cache: 'no-store' });
      if (!r.ok) { var e = new Error('GET ' + r.status); e.status = r.status; throw e; }
      var j = await r.json();
      return { sha: j.sha, text: dec.decode(b64d(String(j.content).replace(/\s/g, ''))) };
    }
    async function ghPut(token, text, sha) {
      var r = await fetch(repoUrl, { method: 'PUT', headers: headers(token, { 'Content-Type': 'application/json' }),
        body: JSON.stringify({ message: 'Update hub data', content: b64e(enc.encode(text)), sha: sha, branch: 'main' }) });
      if (!r.ok) { var e = new Error('PUT ' + r.status); e.status = r.status; throw e; }
    }

    /* saving */
    function schedule() {
      if (conflict) { return; }
      if (!getToken()) { setBar('connect'); return; }
      setBar('pending');
      clearTimeout(timer); timer = setTimeout(save, 1500);
    }
    async function save() {
      if (saving) { return; }
      var token = getToken(); if (!token || conflict) { return; }
      saving = true; var atRev = rev; setBar('saving');
      try {
        var data = serialize();
        var remote = await ghGet(token);
        var m = remote.text.match(/<script type="application\/json" id="vault">([\s\S]*?)<\/script>/);
        var remoteVault = m && JSON.parse(m[1]);
        if (!remoteVault || remoteVault.edit.c !== P.edit.c) { conflict = true; setBar('conflict'); saving = false; return; }
        var viewPart = await seal(v.viewPw, { html: v.html, data: data });
        var editPart = await seal(editPassword, { html: v.html, data: data, viewPw: v.viewPw, repo: v.repo, api: v.api });
        var next = { view: viewPart, edit: editPart };
        var text = remote.text.replace(/(<script type="application\/json" id="vault">)[\s\S]*?(<\/script>)/, function (all, a, b) { return a + JSON.stringify(next) + b; });
        await ghPut(token, text, remote.sha);
        P = next; savedRev = atRev; saving = false;
        if (rev !== savedRev) { schedule(); } else { setBar('saved'); }
      } catch (e) {
        saving = false;
        if (e && e.status === 401) { setToken(''); setBar('connect', 'GitHub rejected the token. Connect again.'); }
        else if (e && (e.status === 403 || e.status === 404)) { setBar('error', 'This token cannot write to the repo. It needs Contents: Read and write.'); }
        else if (e && (e.status === 409 || e.status === 422)) { setBar('error', 'The hub changed while saving.'); }
        else { setBar('error', 'Could not save. Check your connection.'); }
      }
    }
    window.addEventListener('beforeunload', function (ev) {
      if (rev !== savedRev) { ev.preventDefault(); ev.returnValue = ''; }
    });

    /* status bar */
    function btn(label, fn) { var b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.addEventListener('click', fn); b.style.cssText = 'font:inherit;font-weight:700;padding:6px 10px;border:0;background:var(--brand,#5600EF);color:var(--on-brand,#fff);cursor:pointer;border-radius:0'; return b; }
    function setBar(kind, text) {
      if (!bar) { return; }
      var t = { ready: 'Editing is on. Changes save to GitHub automatically.', connect: 'Editing is on. Connect GitHub to save your changes.', pending: 'Unsaved changes…', saving: 'Saving…',
        saved: 'Saved. Viewers see it in about a minute.', conflict: 'The hub was changed somewhere else. Reload to get the latest, then repeat your change.', error: 'Could not save.' };
      msg.textContent = text || t[kind] || ''; actions.textContent = '';
      bar.style.borderColor = kind === 'error' || kind === 'conflict' ? '#B3003F' : '';
      if (kind === 'connect') { actions.appendChild(btn('Connect GitHub', connectForm)); }
      if (kind === 'error') { actions.appendChild(btn('Retry', function () { setBar('saving'); save(); })); }
      if (kind === 'conflict') { actions.appendChild(btn('Reload', function () { location.reload(); })); }
      if (kind === 'ready' || kind === 'saved') { var d = btn('Disconnect', function () { setToken(''); setBar('connect'); }); d.style.background = 'transparent'; d.style.color = 'inherit'; d.style.border = '1px solid currentColor'; if (getToken()) { actions.appendChild(d); } }
    }
    function connectForm() {
      msg.textContent = 'Paste a GitHub token with Contents: Read and write on this repo only.'; actions.textContent = '';
      var inp = document.createElement('input'); inp.type = 'password'; inp.autocomplete = 'off'; inp.placeholder = 'GitHub token'; inp.setAttribute('aria-label', 'GitHub token');
      inp.style.cssText = 'font:inherit;padding:6px 8px;border:1px solid var(--line,#9A9AB0);background:var(--field,#fff);color:inherit;min-width:180px;border-radius:0';
      var help = document.createElement('a'); help.href = 'https://github.com/settings/personal-access-tokens/new'; help.target = '_blank'; help.rel = 'noopener noreferrer'; help.textContent = 'Create one'; help.style.color = 'inherit';
      actions.appendChild(inp);
      actions.appendChild(btn('Save token', async function () {
        var t = inp.value.trim(); if (!t) { return; }
        setBar('saving', 'Checking token…');
        try { await ghGet(t); setToken(t); if (rev !== savedRev) { schedule(); } else { setBar('ready'); } }
        catch (e) { setBar('connect', e && e.status === 401 ? 'GitHub rejected that token.' : 'That token cannot read the repo.'); }
      }));
      actions.appendChild(help);
      inp.focus();
    }
    function mount() {
      bar = document.createElement('div'); bar.id = 'hubSaveBar'; bar.setAttribute('role', 'status');
      bar.style.cssText = 'position:fixed;right:16px;bottom:16px;max-width:calc(100vw - 32px);z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;background:var(--surface,#fff);color:var(--ink,#0D0D14);border:1px solid var(--line,#D9DCE8);font-size:13px;line-height:1.4';
      msg = document.createElement('span'); actions = document.createElement('span'); actions.style.cssText = 'display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px';
      bar.appendChild(msg); bar.appendChild(actions); document.body.appendChild(bar);
      setBar(getToken() ? 'ready' : 'connect');
    }
    return { claude: claude, mount: mount };
  }

  /* ---------- unlock ---------- */
  function launch(v, password) {
    var editor = v.repo ? createEditor(v, password) : null;
    var realFetch = window.fetch.bind(window);
    window.fetch = function (u, o) {
      if (String(u).split('?')[0] === 'data.json') {
        return Promise.resolve(new Response(JSON.stringify(v.data), { status: 200, headers: { 'Content-Type': 'application/json' } }));
      }
      return realFetch(u, o);
    };
    if (editor) { window.claude = editor.claude; }
    document.open(); document.write(v.html); document.close();
    if (editor) { editor.mount(); }
  }
  async function attempt(password, remembered) {
    try {
      var v = await decryptWith(password);
      try { sessionStorage.setItem('bh-gate', password); } catch (e) {}
      launch(v, password);
    } catch (e) {
      if (remembered) { try { sessionStorage.removeItem('bh-gate'); } catch (e2) {} return; }
      err.textContent = window.crypto && crypto.subtle ? 'Wrong password. Try again.' : 'This browser cannot open the dashboard. Use a current browser over https.';
      go.disabled = false; pw.select();
    }
  }
  form.addEventListener('submit', function (ev) {
    ev.preventDefault(); err.textContent = ''; go.disabled = true;
    attempt(pw.value, false);
  });
  var saved = null; try { saved = sessionStorage.getItem('bh-gate'); } catch (e) {}
  if (saved && window.crypto && crypto.subtle) { attempt(saved, true); }
})();
</script>
</body>
</html>
