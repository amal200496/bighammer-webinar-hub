<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#F2F4FA;color:#0D0D14;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
form{width:100%;max-width:360px;background:#fff;border:1px solid #D9DCE8;padding:28px 24px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand img{width:36px;height:36px;display:block}
h1{margin:0;font-size:20px;line-height:1.2}
p{margin:0 0 16px;color:#5B5E73;font-size:14px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input{width:100%;padding:10px 12px;border:1px solid #9A9DB3;background:#fff;color:#0D0D14;font:inherit;border-radius:0}

button{margin-top:14px;width:100%;padding:11px 12px;border:0;background:#5600EF;color:#fff;font:inherit;font-weight:700;cursor:pointer;border-radius:0}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin:10px 0 0;color:#B3003F;font-size:13px}
</style>

        var a = document.createElement('a');
        a.className = 'themebtn'; a.id = 'hubEditLink'; a.textContent = 'Edit dashboard';
        a.href = v.editUrl; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.style.textDecoration = 'none';
        bar.insertBefore(a, bar.firstChild);
      }
    }
  }
  async function attempt(password, remembered) {
    try {
      var v = await decryptWith(password);
      try { sessionStorage.setItem('bh-gate', password); } catch (e) {}
      launch(v);
    } catch (e) {
      if (remembered) { try { sessionStorage.removeItem('bh-gate'); } catch (e2) {} return; }
      err.textContent = window.crypto && crypto.subtle ? 'Wrong password. Try again.' : 'This browser cannot open the dashboard. Use a current browser over https.';
      go.disabled = false; pw.select();
    }
  }
  form.addEventListener('submit', function (ev) {
    ev.preventDefault(); err.textContent = ''; go.disabled = true;
    attempt(pw.value, false);
  });
  var saved = null; try { saved = sessionStorage.getItem('bh-gate'); } catch (e) {}
  if (saved && window.crypto && crypto.subtle) { attempt(saved, true); }
})();
</script>
