<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BigHammer Webinar Hub</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#F2F4FA;color:#0D0D14;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:100%;max-width:440px;background:#fff;border:1px solid #D9DCE8;padding:32px 28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.brand img{width:36px;height:36px;display:block}
.brand span{font-weight:700;font-size:16px}
h1{margin:0 0 12px;font-size:22px;line-height:1.25}
p{margin:0 0 12px;color:#3B3E52}
p:last-child{margin-bottom:0}
a{color:#5600EF;font-weight:600}
a:focus-visible{outline:3px solid #5600EF;outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="logo.png" alt=""><span>BigHammer Webinar Hub</span></div>
  <h1>The webinar hub is not active</h1>
  <p>Webinar progress is now shared as simple text reports.</p>
  <p>For any update on the webinar, please contact Appu at <a href="mailto:appu@bighammer.ai">appu@bighammer.ai</a>.</p>
</main>
</body>
</html>
